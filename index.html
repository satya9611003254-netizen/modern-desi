<!DOCTYPE html>
<html>
<head>
  <title>Modern Desi</title>
  <style>
    body { margin:0; font-family: Arial; background:#fff; }
    header {
      padding:20px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #eee;
    }
    nav a {
      margin-left:20px;
      text-decoration:none;
      color:black;
      font-weight:500;
    }
    .hero {
      height:60vh;
      background:black;
      color:white;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }
    .section {
      padding:40px;
    }
    .products {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap:30px;
    }
    .product {
      border:1px solid #eee;
      padding:20px;
      text-align:center;
    }
    .product img {
      width:100%;
      height:300px;
      object-fit:cover;
      background:#f2f2f2;
    }
    .price {
      font-weight:bold;
      margin:10px 0;
    }
    .buy {
      display:inline-block;
      padding:10px 20px;
      background:black;
      color:white;
      text-decoration:none;
    }
  </style>
</head>

<body>

<header>
  <h2>MODERN DESI</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#shop">Shop</a>
    <a href="#">Contact</a>
  </nav>
</header>

<div class="hero">
  <h1>Luxury Streetwear from India</h1>
  <p>Minimal • Bold • Modern Desi</p>
</div>

<div class="section" id="shop">
  <h2>Our Collection</h2>

  <div class="products">

    <!-- PRODUCT 1 -->
    <div class="product">
      <img src="https://via.placeholder.com/400x500">
      <h3>Modern Desi Black Tee</h3>
      <div class="price">₹1,299</div>
      <a class="buy" href="#">Buy Now</a>
    </div>

    <!-- PRODUCT 2 -->
    <div class="product">
      <img src="https://via.placeholder.com/400x500">
      <h3>Modern Desi White Tee</h3>
      <div class="price">₹1,199</div>
      <a class="buy" href="#">Buy Now</a>
    </div>

    <!-- PRODUCT 3 -->
    <div class="product">
      <img src="https://via.placeholder.com/400x500">
      <h3>Modern Desi Oversized Tee</h3>
      <div class="price">₹1,499</div>
      <a class="buy" href="#">Buy Now</a>
    </div>

  </div>
</div>

</body>
</html>
